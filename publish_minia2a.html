<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurox Sentinel — MiniA2A Publisher</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f19;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 32px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 22px;
      margin-top: 0;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
    }
    .wallet-box {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      color: #38bdf8;
      word-break: break-all;
      margin: 16px 0;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .sig-area {
      display: none;
      margin-top: 20px;
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 16px;
    }
    .sig-area textarea {
      width: 100%;
      height: 70px;
      background: #1e293b;
      color: #a7f3d0;
      border: 1px solid #334155;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      padding: 8px;
      box-sizing: border-box;
      resize: none;
    }
    .copy-btn {
      margin-top: 10px;
      background: #059669;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .copy-btn:hover {
      background: #047857;
    }
    .status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .success {
      background: #064e3b;
      color: #6ee7b7;
      border: 1px solid #059669;
    }
    .error {
      background: #450a0a;
      color: #fca5a5;
      border: 1px solid #dc2626;
    }
    .info {
      background: #172554;
      color: #93c5fd;
      border: 1px solid #2563eb;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>⚡ MiniA2A Publisher</h1>
  <p>Publish <strong>RugShield</strong> & <strong>CanaryGuard</strong> to the <strong>MiniA2A Agent Marketplace</strong>. Signing is <strong>100% free & gasless</strong>.</p>

  <label style="font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 600;">Authorized Merchant Payout Wallet:</label>
  <div class="wallet-box" id="wallet-address">0x80E0Ae84679b7f11bE171DaADd492FBECf628cd6</div>

  <button class="btn" id="publish-btn" onclick="publishServices()">Click to Sign & Capture Signature</button>

  <div class="sig-area" id="sig-area">
    <label style="font-size: 13px; color: #38bdf8; font-weight: 600;">✅ Signature Captured Successfully:</label>
    <textarea id="sig-text" readonly></textarea>
    <button class="copy-btn" id="copy-btn" onclick="copySig()">📋 Copy Signature to Clipboard</button>
  </div>

  <div class="status" id="status-box"></div>
</div>

<script>
  const TARGET_WALLET = "0x80E0Ae84679b7f11bE171DaADd492FBECf628cd6";

  async function publishServices() {
    const btn = document.getElementById("publish-btn");
    const status = document.getElementById("status-box");
    const sigArea = document.getElementById("sig-area");
    const sigText = document.getElementById("sig-text");

    if (!window.ethereum) {
      showStatus("No Ethereum wallet found (MetaMask / Coinbase Wallet). Please open this in a browser with your wallet extension.", "error");
      return;
    }

    try {
      btn.disabled = true;
      btn.innerText = "Connecting Wallet...";
      showStatus("Connecting to wallet...", "info");

      const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
      const currentAccount = accounts[0];

      if (currentAccount.toLowerCase() !== TARGET_WALLET.toLowerCase()) {
        showStatus(`Please switch your wallet account to ${TARGET_WALLET}. Currently connected: ${currentAccount}`, "error");
        btn.disabled = false;
        btn.innerText = "Switch Account & Try Again";
        return;
      }

      btn.innerText = "Awaiting Signature in Wallet...";
      showStatus("Please click 'Sign' in your wallet (gasless off-chain signature)...", "info");

      const message = `minia2a publish: ${TARGET_WALLET}`;
      const signature = await window.ethereum.request({
        method: "personal_sign",
        params: [message, TARGET_WALLET]
      });

      // Display signature immediately so user has it regardless of browser CORS!
      sigArea.style.display = "block";
      sigText.value = signature;

      btn.innerText = "Signature Captured!";
      btn.style.background = "#059669";
      showStatus("🎉 Signature captured! Copy the signature above and paste it in chat, or let the automatic submission try now...", "success");

      // Payload 1: RugShield
      const rugPayload = {
        name: "RugShield Pre-Trade DEX Simulation",
        description: "Pre-trade bytecode swap simulation against DEX liquidity pools on Base to prevent honeypots.",
        endpoint: "https://rugshield-402.onrender.com/v1/audit/swap-simulation-proof",
        price_cents: 10,
        wallet: TARGET_WALLET,
        signature: signature
      };

      // Payload 2: CanaryGuard
      const canaryPayload = {
        name: "CanaryGuard Prompt Injection Firewall",
        description: "Deterministic prompt-injection firewall and context scrubber for autonomous AI agents.",
        endpoint: "https://canaryguard-402.onrender.com/v1/sanitize",
        price_cents: 1,
        wallet: TARGET_WALLET,
        signature: signature
      };

      try {
        const res1 = await fetch("https://minia2a.uk/api/v1/publish-service", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(rugPayload)
        });
        const res2 = await fetch("https://minia2a.uk/api/v1/publish-service", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(canaryPayload)
        });

        if (res1.ok && res2.ok) {
          showStatus("🎉 Both services published directly to MiniA2A!", "success");
        } else {
          showStatus("Signature saved! Browser CORS prevented direct posting to minia2a.uk. Please copy the signature above and paste it into chat!", "info");
        }
      } catch (postErr) {
        showStatus("Signature captured! Browser CORS blocked direct posting to minia2a.uk. Simply click 'Copy Signature to Clipboard' above and paste it here in chat!", "info");
      }

    } catch (err) {
      console.error(err);
      btn.disabled = false;
      btn.innerText = "Click to Sign & Capture Signature";
      showStatus(`Error: ${err.message || err}`, "error");
    }
  }

  function copySig() {
    const text = document.getElementById("sig-text");
    text.select();
    navigator.clipboard.writeText(text.value);
    const copyBtn = document.getElementById("copy-btn");
    copyBtn.innerText = "✅ Copied to Clipboard!";
    setTimeout(() => { copyBtn.innerText = "📋 Copy Signature to Clipboard"; }, 3000);
  }

  function showStatus(msg, type) {
    const box = document.getElementById("status-box");
    box.style.display = "block";
    box.className = `status ${type}`;
    box.innerHTML = msg;
  }
</script>

</body>
</html>
